name: Download page and release metadata checks
on:
  pull_request:
    paths:
      - "apps/brochure/**"
      - "apps/desktop/scripts/release-*.mjs"
      - "apps/desktop/test/release.test.mjs"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/download-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test apps/desktop/test/release.test.mjs
      - run: pnpm --filter @whyfull/brochure typecheck
      - run: pnpm --filter @whyfull/brochure test
      - run: pnpm --filter @whyfull/brochure deploy:dry-run
