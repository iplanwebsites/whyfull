<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f2" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Find your Whyfull license</title>
    <meta
      name="description"
      content="Get your Whyfull desktop license key emailed to you again."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/download.css" />
    <link rel="stylesheet" href="/src/commerce.css" />
  </head>
  <body>
    <div class="wf-home wf-download">
      <a class="wf-home-skip" href="#main">Skip to content</a>
      <header class="wf-home-nav">
        <a class="wf-home-wordmark" href="/" aria-label="Whyfull home"
          >whyfull<span class="wf-home-dot">.</span></a
        >
        <nav aria-label="Main navigation">
          <a href="https://github.com/iplanwebsites/whyfull">Source</a
          ><a href="https://github.com/iplanwebsites/whyfull#readme">Docs</a
          ><a href="/download/">Download</a>
        </nav>
      </header>
      <main id="main">
        <section class="wf-commerce" aria-labelledby="recover-page-title">
          <h1 id="recover-page-title">Find your<br /><em>license.</em></h1>
          <p class="wf-commerce-status">Use your checkout email.</p>
          <form
            class="wf-commerce-form"
            id="wf-recover-form"
            action="/api/recover"
            method="post"
          >
            <label for="wf-recover-email">Email address</label>
            <input
              id="wf-recover-email"
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="254"
            />
            <button type="submit" class="wf-home-button">
              Email my license
            </button>
          </form>
          <p
            class="wf-home-small wf-commerce-status"
            id="wf-recover-status"
            role="status"
            aria-live="polite"
          ></p>
          <details class="wf-commerce-section">
            <summary>Nothing arrived?</summary>
            <p>
              Check spam or another checkout email. Still missing? Reply to your
              Stripe receipt.
            </p>
          </details>
        </section>
      </main>
      <footer class="wf-home-footer">
        <a class="wf-home-wordmark" href="/">whyfull.</a>
        <nav aria-label="Footer navigation">
          <a href="/legal/">Terms &amp; privacy</a
          ><a href="/recover/">Find my license</a>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/recover.js"></script>
  </body>
</html>
